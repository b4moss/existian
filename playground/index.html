<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>existian playground</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", sans-serif;
        line-height: 1.5;
      }
      body {
        margin: 0;
        padding: 2rem;
        background: #f6f7f9;
        color: #1b1f24;
      }
      main {
        max-width: 40rem;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.35rem;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 0.6rem 0.75rem;
        border: 1px solid #c9d0d8;
        border-radius: 0.4rem;
        font: inherit;
      }
      [data-ex-status="pending"] {
        outline: 2px solid #f59f00;
      }
      [data-ex-status="success"] {
        outline: 2px solid #2f9e44;
      }
      [data-ex-status="invalid"] {
        outline: 2px solid #e03131;
      }
      [data-ex-status="error"] {
        outline: 2px solid #9c36b5;
      }
      .msg {
        margin-top: 0.75rem;
        min-height: 1.5rem;
      }
      .msg:not([data-ex-status="invalid"]):not([data-ex-status="error"]):not([data-ex-status="pending"]) {
        opacity: 0.45;
      }
      .msg[data-ex-status="pending"]::before {
        content: "checking…";
      }
      .msg[data-ex-status="success"]::before {
        content: "available";
      }
      .msg[data-ex-status="invalid"]::before {
        content: "already taken";
      }
      .msg[data-ex-status="error"]::before {
        content: "request failed";
      }
      code {
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>@b4moss/existian</h1>
      <p>
        Type a username. Mock API treats <code>taken</code> as existing
        (<code>exists: true</code> → invalid when expecting <code>false</code>).
      </p>
      <label for="username">Username</label>
      <input
        id="username"
        type="text"
        data-ex-check="/api/users/exists"
        data-ex-debounce="300"
        data-ex-timeout="5000"
        data-ex-state="username"
        data-ex-pending="busy"
        data-ex-response-property="exists"
        data-ex-response-value="false"
        data-ex-response-match="exact"
      />
      <p class="msg" data-ex-state="username"></p>
    </main>
    <script type="module">
      const originalFetch = window.fetch.bind(window);
      window.fetch = async (input, init) => {
        const url = new URL(String(input), location.href);
        if (url.pathname === "/api/users/exists") {
          await new Promise((r) => setTimeout(r, 400));
          const value = url.searchParams.get("value") ?? "";
          const exists = value.toLowerCase() === "taken";
          return new Response(JSON.stringify({ exists }), {
            status: 200,
            headers: { "Content-Type": "application/json" },
          });
        }
        return originalFetch(input, init);
      };

      const { init } = await import("../dist/existian.js");
      init();
    </script>
  </body>
</html>
