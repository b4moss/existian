<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>existian</title>
    <meta http-equiv="refresh" content="0;url=./en/" />
    <script>
      (() => {
        const list = navigator.languages?.length
          ? navigator.languages
          : [navigator.language || "en"];
        const preferJa = list.some((l) =>
          String(l).toLowerCase().startsWith("ja"),
        );
        location.replace(preferJa ? "./ja/" : "./en/");
      })();
    </script>
  </head>
  <body>
    <p>
      <a href="./en/">English</a>
      ·
      <a href="./ja/">日本語</a>
    </p>
  </body>
</html>
