# CI — PRs to develop / dev-* / main, and pushes to main (Codecov + badge).
name: CI

on:
  pull_request:
    branches:
      - develop
      - "dev-*"
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test with coverage
        run: npm test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  result:
    name: Test & Build
    needs: [test, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate
        run: |
          set -euo pipefail
          test_result='${{ needs.test.result }}'
          build_result='${{ needs.build.result }}'
          echo "test=${test_result} build=${build_result}"
          if [ "${test_result}" = "success" ] && [ "${build_result}" = "success" ]; then
            exit 0
          fi
          echo "::error::Test and/or Build did not succeed"
          exit 1
